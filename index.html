<!doctype html>
<html lang="en" data-theme="slate-brass" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Gsheets || Second Edition</title>
		<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Metamorphous&display=swap" rel="stylesheet">
		<script>
			/* Runs before the stylesheet so a saved light mode never flashes
			   dark first. Deliberately duplicates a little of applyTheme() --
			   it must not depend on app.js, which loads far later. Wrapped in
			   try/catch because localStorage throws in private-mode Safari.. */
			try {
				var t = JSON.parse(localStorage.getItem('gsheets_theme') || '{}');
				if (t.theme) document.documentElement.setAttribute('data-theme', t.theme);
				if (t.mode)  document.documentElement.setAttribute('data-mode',  t.mode);
			} catch (e) {}
		</script>
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<div class="wrap">
			<header>
			  <div>
				<h1>Gsheets || Second Edition</h1>
				<div class="subtitle">AD&D 2e Character Sheet Manager</div>
			  </div>

			  <!-- MODE LAMP. Lives INSIDE the header, in the right-hand half
			       that header's justify-content:space-between was already
			       reserving and that nothing had ever occupied. The control it
			       replaces was position:fixed and floated over the page
			       independently of the layout, which is why it needed a media
			       query to stop colliding with content on narrow screens. As a
			       header child it flows correctly and that query is gone.

			       A real <button>, not a div with an inline onclick: keyboard
			       operation, focus and a screen-reader name all come for free.
			       The handler is bound in app.js, so the markup carries no
			       behaviour.

			       The SVG is IDENTICAL in both modes. style.css lights the
			       .flame and .glass paths off <html data-mode> -- there is no
			       second icon and nothing for JS to keep in sync. -->
			  <button type="button" class="mode-lamp" id="mode-lamp"
			          aria-label="Light mode" aria-pressed="false"
			          title="Switch to light mode">
				<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				  <path class="glass" stroke="none" d="M8.6 8.2h6.8l.6 7.4H8z"/>
				  <path d="M9.6 4.3a2.4 2.4 0 0 1 4.8 0M8.2 8.2l1-2.1h5.6l1 2.1M8.6 8.2h6.8l.6 7.4H8zM7.2 15.6h9.6l.5 2.2H6.7z"/>
				  <path class="flame" stroke="none" d="M12 10.3c1.5 1.1 1.5 2.9 0 4-1.5-1.1-1.5-2.9 0-4z"/>
				</svg>
			  </button>
			</header>
			<div class="tabs" id="tab-bar">
				<div class="tab active" data-id="default">
					<span class="label">Character 1</span>
					<span class="close">×</span>
				</div>
				<button id="add-tab" class="ghost">+ New Tab</button>
			</div>
			<div id="tab-contents">
				<div class="tab-content active" data-id="default">
					<div class="grid sheet-container"></div>
				</div>
			</div>
				<footer class="wrap small">Gsheets v.11.1.0 || 2nd Edition Character Sheet Editor.  © 2026 C.O.Boatwright</footer>
			</div>
	  <script src="js/tables.js"></script>
	  <script src="js/kits.js"></script>
	  <script src="js/spells.js"></script>
	  <script src="js/languages.js"></script>
	  <script src="js/equipment.js"></script>
	  <script src="js/goods.js"></script>
	  <script src="js/animals.js"></script>
	  <script src="js/weapons.js"></script>
	  <script src="js/ammunition.js"></script>
	  <script src="js/armor.js"></script>
	  <script src="js/wp.js"></script>
	  <script src="js/nwp.js"></script>
	  <script src="js/conditions.js"></script>
	  <script src="js/multiclass.js"></script>
	  <script src="js/dualclass.js"></script>
	  <script src="js/sheet_template.js"></script>
	  <script src="js/calc.js"></script>
	  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
	  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
	  <script src="js/print.js"></script>
	  <script src="js/app.js"></script>
	</body>
</html>
